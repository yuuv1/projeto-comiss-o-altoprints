name: Publicar sistema (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # O jsdom 30 (usado nos testes de tela) exige Node 22.22+ — com o Node 20
          # os testes quebravam com "Promise.withResolvers is not a function".
          node-version: 22

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Rodar os testes
        working-directory: app
        run: npm run testar

      - name: Gerar a versão de produção
        working-directory: app
        env:
          # Configure em Settings > Secrets and variables > Actions (opcional)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

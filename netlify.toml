# Configuração do Netlify
# Usada quando o site é publicado pelo Netlify conectado ao GitHub (recomendado).
# No "Netlify Drop" (arrastar a pasta dist) este arquivo não é lido.

[build]
  # o projeto React fica dentro da pasta app/
  base = "app"
  # build + a conferência do pacote (o site só sobe se estiver limpo)
  command = "npm run build && npm run checar dist"
  publish = "dist"

[build.environment]
  # os testes e o jsdom 30 precisam do Node 22.22+ (o package.json pede o mesmo)
  NODE_VERSION = "22"

# Garante que qualquer endereço abra o sistema (mesmo com caminhos digitados na mão)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos simples de segurança/desempenho
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
